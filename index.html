<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProdPilot — Pilotage Prévisionnel Call Center Énergie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#09090b;--surface:#111116;--surface2:#18181f;--surface3:#1f1f2e;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
      --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;
      --primary:#6366f1;--primary-dark:#4f46e5;--primary-glow:rgba(99,102,241,0.15);
      --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
      --success-bg:rgba(16,185,129,0.1);--warning-bg:rgba(245,158,11,0.1);--danger-bg:rgba(239,68,68,0.1);
      --radius:12px;--radius-sm:8px
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

    /* HEADER */
    .app-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 24px;height:60px;border-bottom:1px solid var(--border);
      background:var(--surface);position:sticky;top:0;z-index:100
    }
    .header-logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .logo-text{font-size:15px;font-weight:700;color:var(--text)}
    .logo-sub{font-size:11px;color:var(--muted);margin-top:1px}
    .month-nav{display:flex;align-items:center;gap:12px}
    .month-nav button{background:var(--surface2);border:1px solid var(--border2);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
    .month-nav button:hover{background:var(--surface3);border-color:var(--primary)}
    .month-display{font-size:14px;font-weight:600;color:var(--text);min-width:100px;text-align:center}
    .header-actions{display:flex;gap:8px}

    /* NAV */
    .app-nav{
      display:flex;gap:2px;padding:0 24px;
      border-bottom:1px solid var(--border);background:var(--surface);
      position:sticky;top:60px;z-index:99
    }
    .nav-tab{
      display:flex;align-items:center;gap:7px;padding:0 16px;height:44px;
      border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:500;
      cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;
      font-family:'Inter',sans-serif
    }
    .nav-tab:hover{color:var(--text)}
    .nav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .nav-tab .tab-icon{font-size:15px}

    /* MAIN */
    .app-main{padding:24px;max-width:1400px;margin:0 auto}

    /* PAGE HEADER */
    .page-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .page-header h2{font-size:20px;font-weight:700;color:var(--text)}
    .month-badge{background:var(--primary-glow);color:var(--primary);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid rgba(99,102,241,0.2)}

    /* KPI GRID */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
    .kpi-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:20px;transition:border-color 0.15s
    }
    .kpi-card:hover{border-color:var(--border2)}
    .kpi-icon{font-size:20px;margin-bottom:12px}
    .kpi-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
    .kpi-value{font-size:28px;font-weight:800;color:var(--text);line-height:1;margin-bottom:4px}
    .kpi-sub{font-size:11px;color:var(--muted)}

    /* INFO ROW */
    .info-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .info-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted2);font-weight:500}

    /* CC CARDS */
    .cc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
    .cc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .cc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
    .cc-name{font-size:14px;font-weight:700;color:var(--text)}
    .cc-agents{font-size:12px;color:var(--muted)}
    .cc-stat{margin-bottom:12px}
    .cc-stat-label{font-size:11px;color:var(--muted);margin-bottom:4px}
    .cc-stat-value{font-size:18px;font-weight:700;color:var(--text)}
    .cc-stat-sub{font-size:11px;color:var(--muted)}
    .progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
    .progress-fill.success{background:var(--success)}
    .progress-fill.warning{background:var(--warning)}
    .progress-fill.danger{background:var(--danger)}

    /* BADGES */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .badge.success{background:var(--success-bg);color:var(--success)}
    .badge.warning{background:var(--warning-bg);color:var(--warning)}
    .badge.danger{background:var(--danger-bg);color:var(--danger)}

    /* CHARTS */
    .charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .chart-card h3{font-size:13px;font-weight:600;color:var(--muted2);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px}
    .chart-container{position:relative;height:280px}

    /* SECTION CARD */
    .section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .section-card h3{font-size:13px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:0.5px}

    /* TABLES */
    .data-table{width:100%;border-collapse:collapse}
    .data-table th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:10px 12px;border-bottom:1px solid var(--border)}
    .data-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
    .data-table tbody tr:last-child td{border-bottom:none}
    .data-table tbody tr:hover td{background:rgba(255,255,255,0.02)}
    .data-table tfoot tr td{border-bottom:none}
    .data-table .row-total td{background:var(--surface3);font-weight:700;font-size:13px;color:var(--text);border-top:1px solid var(--border2)}
    .data-table .num{text-align:right;font-variant-numeric:tabular-nums}
    .data-table .supplier-name{display:flex;align-items:center;gap:8px}
    .supplier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

    /* CONFIG TABLE */
    .config-table{width:100%;border-collapse:collapse}
    .config-table th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
    .config-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
    .config-table tbody tr:last-child td{border-bottom:none}
    .config-table tbody tr:hover td{background:rgba(255,255,255,0.02)}
    .config-table tfoot tr td{background:var(--surface3);font-weight:700;border-top:1px solid var(--border2);border-bottom:none}
    .config-table .computed{font-size:12px;color:var(--muted2);font-weight:600}

    /* INPUTS */
    .input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s}
    .input:focus{border-color:var(--primary)}
    .input.w-sm{width:70px}
    .input.w-md{width:90px}
    .input.w-lg{width:120px}
    .input-name{background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);padding:4px 2px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:130px}
    .input-name:hover,.input-name:focus{border-bottom-color:var(--border2)}
    select.input{cursor:pointer}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;font-family:'Inter',sans-serif}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
    .btn-outline:hover{background:var(--surface2);border-color:var(--primary)}
    .btn-ghost{background:transparent;border:1px solid transparent;color:var(--muted2)}
    .btn-ghost:hover{background:var(--surface2);color:var(--text)}
    .btn-danger{background:var(--danger-bg);border:1px solid transparent;color:var(--danger)}
    .btn-danger:hover{background:rgba(239,68,68,0.2)}
    .btn-sm{padding:5px 12px;font-size:12px}

    /* SUB-NAV */
    .sub-nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;width:fit-content}
    .sub-nav-btn{padding:6px 16px;border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif}
    .sub-nav-btn.active{background:var(--surface3);color:var(--text)}

    /* PERIOD TABS */
    .period-tabs{display:flex;gap:4px}
    .period-btn{padding:5px 14px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif}
    .period-btn.active{background:var(--primary-glow);border-color:var(--primary);color:var(--primary)}

    /* CC CONFIG */
    .cc-config-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
    .cc-config-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .cc-config-card h3{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px}
    .form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
    .form-row label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px}

    /* SIMULATION */
    .sim-layout{display:grid;grid-template-columns:320px 1fr;gap:20px}
    .sim-controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;height:fit-content}
    .sim-controls h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 12px;border-top:1px solid var(--border);padding-top:16px}
    .sim-controls h3:first-child{border-top:none;margin-top:0;padding-top:0}
    .slider-row{margin-bottom:14px}
    .slider-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .slider-name{font-size:13px;color:var(--text)}
    .slider-val{font-size:13px;font-weight:700;color:var(--primary)}
    input[type=range]{width:100%;height:4px;appearance:none;-webkit-appearance:none;background:var(--surface3);border-radius:2px;outline:none;cursor:pointer}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;background:var(--primary);border-radius:50%;cursor:pointer;transition:transform 0.1s}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
    input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--primary);border-radius:50%;cursor:pointer;border:none}
    .sim-results{display:flex;flex-direction:column;gap:16px}
    .sim-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .sim-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .sim-kpi .label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
    .sim-kpi .value{font-size:22px;font-weight:800;color:var(--text)}
    .sim-kpi .delta{font-size:11px;margin-top:3px}
    .delta-pos{color:var(--success)}
    .delta-neg{color:var(--danger)}
    .delta-neu{color:var(--muted)}

    /* DUP SECTION */
    .dup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}

    /* PRIORITY COLORS */
    .prio-1{color:#f59e0b;font-weight:600}
    .prio-2{color:var(--primary);font-weight:600}
    .prio-3{color:var(--muted2);font-weight:600}

    /* PRINT */
    @media print{
      .app-header,.app-nav,.header-actions,.nav-tab,.btn,.sub-nav,.period-tabs,
      .sim-controls,button{display:none!important}
      body{background:#fff;color:#000}
      .app-main{padding:0;max-width:100%}
      .section-card,.kpi-card,.cc-card,.chart-card{border:1px solid #ddd;background:#fff;break-inside:avoid}
      .data-table th,.data-table td{color:#000;border-color:#ddd}
      .kpi-value,.cc-stat-value{color:#000}
      .kpi-label,.cc-stat-label{color:#666}
      .row-total td{background:#f5f5f5!important}
      .page-break{page-break-before:always}
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}

    /* TRANSITIONS */
    .section-card,.kpi-card,.cc-card{transition:border-color 0.15s}
    section{animation:fadeIn 0.2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-logo">
      <div class="logo-icon">&#9889;</div>
      <div>
        <div class="logo-text">ProdPilot</div>
        <div class="logo-sub">Call Center Energie</div>
      </div>
    </div>
    <div class="month-nav">
      <button id="btnPrevMonth" title="Mois precedent">&#8249;</button>
      <span id="monthDisplay" class="month-display">Mars 2026</span>
      <button id="btnNextMonth" title="Mois suivant">&#8250;</button>
    </div>
    <div class="header-actions">
      <button id="btnExport" class="btn btn-outline">&#128424; Export PDF</button>
    </div>
  </header>
  <nav class="app-nav">
    <button class="nav-tab active" data-tab="dashboard"><span class="tab-icon">&#128202;</span>Tableau de bord</button>
    <button class="nav-tab" data-tab="config"><span class="tab-icon">&#9881;</span>Configuration</button>
    <button class="nav-tab" data-tab="matrix"><span class="tab-icon">&#128203;</span>Matrice</button>
    <button class="nav-tab" data-tab="simulation"><span class="tab-icon">&#128300;</span>Simulation</button>
  </nav>
  <main class="app-main">
    <section id="tab-dashboard"></section>
    <section id="tab-config" hidden></section>
    <section id="tab-matrix" hidden></section>
    <section id="tab-simulation" hidden></section>
  </main>
</div>

<script>
const STORAGE_KEY = 'prodpilot_v2';
const MONTHS_FR = ['Janvier','F\u00e9vrier','Mars','Avril','Mai','Juin','Juillet','Ao\u00fbt','Septembre','Octobre','Novembre','D\u00e9cembre'];
const SUPPLIER_COLORS = ['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ec4899'];

const DEFAULT_SUPPLIERS = [
  {id:'s1',name:'Octopus',brut:8000,txSig:0.65,txFact:0.85,valMoy:120,priority:1,splitMode:'auto',splitAdm:56},
  {id:'s2',name:'Engie',brut:12000,txSig:0.70,txFact:0.88,valMoy:150,priority:1,splitMode:'auto',splitAdm:56},
  {id:'s3',name:'TotalEnergie',brut:10000,txSig:0.68,txFact:0.82,valMoy:135,priority:2,splitMode:'auto',splitAdm:56},
  {id:'s4',name:'Ekwateur',brut:5000,txSig:0.60,txFact:0.80,valMoy:110,priority:2,splitMode:'auto',splitAdm:56},
  {id:'s5',name:'Ilek',brut:4000,txSig:0.62,txFact:0.78,valMoy:105,priority:3,splitMode:'auto',splitAdm:56},
  {id:'s6',name:'Plenitude / ENI',brut:7000,txSig:0.66,txFact:0.84,valMoy:125,priority:2,splitMode:'auto',splitAdm:56}
];

const DEFAULT_SETTINGS = { workingDays:26, productivityPerAgent:20 };
const DEFAULT_CC = { adm:{agents:95,hoursPerDay:7}, active:{agents:75,hoursPerDay:7} };

let currentYear = 2026, currentMonth = 2;
let activeTab = 'dashboard', matrixView = 'global', matrixPeriod = 'mensuel';
const charts = {};

function loadStorage(){
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; }
  catch(e){ return {}; }
}
function saveStorage(d){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
  catch(e){}
}
function getMonthKey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function getCurrentKey(){ return getMonthKey(currentYear, currentMonth); }

function getMonthData(key){
  const s = loadStorage();
  if(s.months && s.months[key]) return s.months[key];
  return { suppliers: JSON.parse(JSON.stringify(DEFAULT_SUPPLIERS)), settings: Object.assign({},DEFAULT_SETTINGS) };
}
function saveMonthData(key, data){
  const s = loadStorage();
  if(!s.months) s.months = {};
  s.months[key] = data;
  saveStorage(s);
}
function getCCData(){ const s = loadStorage(); return s.cc || JSON.parse(JSON.stringify(DEFAULT_CC)); }
function saveCCData(cc){ const s = loadStorage(); s.cc = cc; saveStorage(s); }
function getCurrentData(){ return getMonthData(getCurrentKey()); }
function saveCurrentData(data){ saveMonthData(getCurrentKey(), data); }

function calcAll(){
  const data = getCurrentData();
  const cc = getCCData();
  const totalAgents = cc.adm.agents + cc.active.agents;
  const autoAdmW = totalAgents > 0 ? cc.adm.agents / totalAgents : 0.5;
  const wd = data.settings.workingDays || 26;
  const prod = data.settings.productivityPerAgent || 20;
  const WD = 4.33;

  const suppliers = data.suppliers.map(function(s, i){
    const admW = s.splitMode === 'manual' ? s.splitAdm / 100 : autoAdmW;
    const actW = 1 - admW;
    const signe = Math.round(s.brut * s.txSig);
    const facture = Math.round(signe * s.txFact);
    const ca = Math.round(facture * s.valMoy);
    const admBrut = Math.round(s.brut * admW);
    const admSigne = Math.round(signe * admW);
    const actBrut = s.brut - admBrut;
    const actSigne = signe - admSigne;
    return Object.assign({}, s, {
      color: SUPPLIER_COLORS[i % SUPPLIER_COLORS.length],
      signe: signe, facture: facture, ca: ca,
      admBrut: admBrut, admSigne: admSigne, actBrut: actBrut, actSigne: actSigne,
      brutH: Math.round(s.brut/WD), signeH: Math.round(signe/WD),
      admBrutH: Math.round(admBrut/WD), admSigneH: Math.round(admSigne/WD),
      actBrutH: Math.round(actBrut/WD), actSigneH: Math.round(actSigne/WD),
      brutJ: Math.round(s.brut/wd), signeJ: Math.round(signe/wd),
      admBrutJ: Math.round(admBrut/wd), admSigneJ: Math.round(admSigne/wd),
      actBrutJ: Math.round(actBrut/wd), actSigneJ: Math.round(actSigne/wd)
    });
  });

  const keys = ['brut','signe','facture','ca','admBrut','admSigne','actBrut','actSigne',
    'brutH','signeH','admBrutH','admSigneH','actBrutH','actSigneH',
    'brutJ','signeJ','admBrutJ','admSigneJ','actBrutJ','actSigneJ'];
  const T = suppliers.reduce(function(a, s){
    keys.forEach(function(k){ a[k] = (a[k]||0) + s[k]; });
    return a;
  }, {name:'TOTAL'});

  const capAdm = cc.adm.agents * prod * wd;
  const capAct = cc.active.agents * prod * wd;
  const capTotal = capAdm + capAct;
  const uAdm = capAdm > 0 ? T.admBrut / capAdm * 100 : 0;
  const uAct = capAct > 0 ? T.actBrut / capAct * 100 : 0;
  const uTotal = capTotal > 0 ? T.brut / capTotal * 100 : 0;
  const txSigGlobal = T.brut > 0 ? T.signe / T.brut : 0;
  const txFactGlobal = T.signe > 0 ? T.facture / T.signe : 0;
  const valMoyGlobal = T.facture > 0 ? T.ca / T.facture : 0;

  return {
    suppliers: suppliers, totals: T,
    capacity: {adm: capAdm, active: capAct, total: capTotal},
    utilization: {adm: uAdm, active: uAct, total: uTotal},
    rates: {txSig: txSigGlobal, txFact: txFactGlobal, valMoy: valMoyGlobal},
    cc: cc, settings: data.settings
  };
}

function feasibility(used, cap){
  const p = cap > 0 ? used / cap * 100 : 0;
  if(p > 100) return {cls:'danger', label:'Non atteignable', icon:'&#128308;', pct: Math.min(p,100)};
  if(p > 85)  return {cls:'warning', label:'Limite', icon:'&#128992;', pct: p};
  return {cls:'success', label:'OK', icon:'&#128994;', pct: p};
}

function fmt(n){ return Math.round(n||0).toLocaleString('fr-FR'); }
function fmtEur(n){ return Math.round(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}); }
function fmtPct(n){ return ((n||0)*100).toFixed(1)+'%'; }

function feasBadge(used, cap){
  const f = feasibility(used, cap);
  return '<span class="badge '+f.cls+'">'+f.icon+' '+f.label+'</span>';
}
function feasBar(used, cap){
  const f = feasibility(used, cap);
  const pct = Math.min(f.pct, 100).toFixed(1);
  return '<div class="progress-bar"><div class="progress-fill '+f.cls+'" style="width:'+pct+'%"></div></div><div style="font-size:10px;color:var(--muted);margin-top:2px">'+pct+'% utilis\u00e9</div>';
}

function showTab(tab){
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
  document.querySelectorAll('#app main section').forEach(function(s){ s.hidden = true; });
  document.getElementById('tab-'+tab).hidden = false;
  renderTab(tab);
}

function renderTab(tab){
  if(tab === 'dashboard') renderDashboard();
  else if(tab === 'config') renderConfig();
  else if(tab === 'matrix') renderMatrix();
  else if(tab === 'simulation') renderSimulation();
}

function updateHeader(){
  document.getElementById('monthDisplay').textContent = MONTHS_FR[currentMonth]+' '+currentYear;
}
function prevMonth(){
  currentMonth--; if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  updateHeader(); renderTab(activeTab);
}
function nextMonth(){
  currentMonth++; if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  updateHeader(); renderTab(activeTab);
}

function genMonthOptions(offset){
  offset = offset || 0;
  let html = '';
  for(let m = 0; m < 12; m++){
    const mo = (currentMonth + offset + m) % 12;
    const yr = currentYear + Math.floor((currentMonth + offset + m) / 12);
    const key = getMonthKey(yr, mo);
    const sel = (m === 0) ? 'selected' : '';
    html += '<option value="'+key+'" '+sel+'>'+MONTHS_FR[mo]+' '+yr+'</option>';
  }
  return html;
}

function renderMatrix(){
  const calc = calcAll();

  function matRows(view, period){
    const sup = calc.suppliers;
    const T = calc.totals;
    const brutKey    = period==='mensuel' ? 'brut'    : period==='hebdo' ? 'brutH'    : 'brutJ';
    const signeKey   = period==='mensuel' ? 'signe'   : period==='hebdo' ? 'signeH'   : 'signeJ';
    const admBrutKey = period==='mensuel' ? 'admBrut' : period==='hebdo' ? 'admBrutH' : 'admBrutJ';
    const admSigneKey= period==='mensuel' ? 'admSigne': period==='hebdo' ? 'admSigneH': 'admSigneJ';
    const actBrutKey = period==='mensuel' ? 'actBrut' : period==='hebdo' ? 'actBrutH' : 'actBrutJ';
    const actSigneKey= period==='mensuel' ? 'actSigne': period==='hebdo' ? 'actSigneH': 'actSigneJ';

    if(view === 'global'){
      let rows = sup.map(function(s){
        return '<tr>'
          +'<td><span class="supplier-name"><span class="supplier-dot" style="background:'+s.color+'"></span>'+s.name+'</span></td>'
          +'<td class="num">'+fmt(s[brutKey])+'</td><td class="num">'+fmt(s[signeKey])+'</td>'
          +'<td class="num">'+fmt(s[admBrutKey])+'</td><td class="num">'+fmt(s[admSigneKey])+'</td>'
          +'<td class="num">'+fmt(s[actBrutKey])+'</td><td class="num">'+fmt(s[actSigneKey])+'</td>'
          +'</tr>';
      }).join('');
      return '<table class="data-table">'
        +'<thead><tr><th>Fournisseur</th><th class="num">Brut</th><th class="num">Sign\u00e9</th><th class="num">ADM Brut</th><th class="num">ADM Sign\u00e9</th><th class="num">Active Brut</th><th class="num">Active Sign\u00e9</th></tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'<tfoot><tr class="row-total"><td><strong>TOTAL</strong></td>'
        +'<td class="num">'+fmt(T[brutKey])+'</td><td class="num">'+fmt(T[signeKey])+'</td>'
        +'<td class="num">'+fmt(T[admBrutKey])+'</td><td class="num">'+fmt(T[admSigneKey])+'</td>'
        +'<td class="num">'+fmt(T[actBrutKey])+'</td><td class="num">'+fmt(T[actSigneKey])+'</td>'
        +'</tr></tfoot></table>';
    }
    const iAdm = view === 'adm';
    const bk = iAdm ? admBrutKey : actBrutKey;
    const sk = iAdm ? admSigneKey : actSigneKey;
    const tb = iAdm ? T[admBrutKey] : T[actBrutKey];
    const ts = iAdm ? T[admSigneKey] : T[actSigneKey];
    let rows2 = sup.map(function(s){
      return '<tr>'
        +'<td><span class="supplier-name"><span class="supplier-dot" style="background:'+s.color+'"></span>'+s.name+'</span></td>'
        +'<td class="num">'+fmt(s[bk])+'</td><td class="num">'+fmt(s[sk])+'</td>'
        +'</tr>';
    }).join('');
    return '<table class="data-table">'
      +'<thead><tr><th>Fournisseur</th><th class="num">Brut</th><th class="num">Sign\u00e9</th></tr></thead>'
      +'<tbody>'+rows2+'</tbody>'
      +'<tfoot><tr class="row-total"><td><strong>TOTAL</strong></td><td class="num">'+fmt(tb)+'</td><td class="num">'+fmt(ts)+'</td></tr></tfoot>'
      +'</table>';
  }

  const periodLabel = {
    'mensuel': 'Mensuel',
    'hebdo': 'Hebdomadaire (\u00f74,33)',
    'journalier': 'Journalier (\u00f7'+calc.settings.workingDays+' jours)'
  };
  const viewLabel = {'global':'Vue Globale','adm':'ADM Value','active':'Active Contact'};

  const subNavBtns = ['global','adm','active'].map(function(v){
    const lbl = v==='global'?'&#127760; Global':v==='adm'?'&#127970; ADM Value':'&#127970; Active Contact';
    return '<button class="sub-nav-btn'+(matrixView===v?' active':'')+'" onclick="setMatrixView(\''+v+'\')">'+lbl+'</button>';
  }).join('');
  const periodBtns = ['mensuel','hebdo','journalier'].map(function(p){
    const lbl = p==='mensuel'?'&#128197; Mensuel':p==='hebdo'?'&#128198; Hebdomadaire':'&#128202; Journalier';
    return '<button class="period-btn'+(matrixPeriod===p?' active':'')+'" onclick="setMatrixPeriod(\''+p+'\')">'+lbl+'</button>';
  }).join('');

  let extra = '';
  if(matrixPeriod === 'hebdo'){
    extra = '<span class="info-chip">Base\u00a0: mensuel \u00f7 4,33</span>';
  } else if(matrixPeriod === 'journalier'){
    extra = '<span class="info-chip">Base\u00a0: mensuel \u00f7 '+calc.settings.workingDays+' jours ouvrés (lun-sam)</span>';
  }

  let summaryBlock = '';
  if(matrixPeriod === 'mensuel'){
    summaryBlock = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
      +'<div class="section-card" style="margin-bottom:0"><div class="section-header"><h3>R\u00e9sum\u00e9 Hebdomadaire</h3></div>'+matRows(matrixView,'hebdo')+'</div>'
      +'<div class="section-card" style="margin-bottom:0"><div class="section-header"><h3>R\u00e9sum\u00e9 Journalier</h3></div>'+matRows(matrixView,'journalier')+'</div>'
      +'</div>';
  }

  document.getElementById('tab-matrix').innerHTML =
    '<div class="page-header"><h2>Matrice de production</h2><span class="month-badge">'+MONTHS_FR[currentMonth]+' '+currentYear+'</span></div>'
    +'<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px">'
    +'<div class="sub-nav">'+subNavBtns+'</div>'
    +'<div class="period-tabs">'+periodBtns+'</div>'
    +'</div>'
    +'<div class="section-card">'
    +'<div class="section-header"><h3>'+viewLabel[matrixView]+' &mdash; '+periodLabel[matrixPeriod]+'</h3>'+extra+'</div>'
    +matRows(matrixView, matrixPeriod)
    +'</div>'
    +summaryBlock;
}

let simMultipliers = {};
let simAdmAgents = 0, simActAgents = 0;
let simInitialized = false;

function initSim(){
  const calc = calcAll();
  const cc = getCCData();
  simAdmAgents = cc.adm.agents;
  simActAgents = cc.active.agents;
  calc.suppliers.forEach(function(s){ simMultipliers[s.id] = 100; });
  simInitialized = true;
}

function renderSimulation(){
  if(!simInitialized) initSim();
  const calc = calcAll();
  const cc = getCCData();
  const data = getCurrentData();
  const wd = data.settings.workingDays || 26;
  const prod = data.settings.productivityPerAgent || 20;
  const totalAgents = simAdmAgents + simActAgents;
  const admW = totalAgents > 0 ? simAdmAgents / totalAgents : 0.5;

  const calcedSim = data.suppliers.map(function(s, i){
    const mult = simMultipliers[s.id] || 100;
    const brut = Math.round(s.brut * mult / 100);
    const aW = s.splitMode === 'manual' ? s.splitAdm / 100 : admW;
    const signe = Math.round(brut * s.txSig);
    const facture = Math.round(signe * s.txFact);
    const ca = Math.round(facture * s.valMoy);
    return Object.assign({}, s, {
      color: SUPPLIER_COLORS[i % SUPPLIER_COLORS.length],
      brut: brut, signe: signe, facture: facture, ca: ca,
      admBrut: Math.round(brut * aW), actBrut: Math.round(brut * (1 - aW))
    });
  });

  const simT = calcedSim.reduce(function(a, s){
    ['brut','signe','facture','ca','admBrut','actBrut'].forEach(function(k){ a[k] = (a[k]||0) + s[k]; });
    return a;
  }, {});

  const simCapAdm = simAdmAgents * prod * wd;
  const simCapAct = simActAgents * prod * wd;
  const T = calc.totals;

  function delta(sim, orig){
    const d = sim - orig;
    const pct = orig > 0 ? d / orig * 100 : 0;
    const cls = d >= 0 ? 'delta-pos' : 'delta-neg';
    return '<span class="'+cls+'">'+(d>=0?'+':'')+fmt(d)+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)</span>';
  }
  function deltaEur(sim, orig){
    const d = sim - orig;
    const pct = orig > 0 ? d / orig * 100 : 0;
    const cls = d >= 0 ? 'delta-pos' : 'delta-neg';
    return '<span class="'+cls+'">'+(d>=0?'+':'')+fmtEur(d)+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)</span>';
  }

  let volSliders = calc.suppliers.map(function(s){
    const mult = simMultipliers[s.id] || 100;
    const dotStyle = 'width:8px;height:8px;border-radius:50%;background:'+s.color+';flex-shrink:0;display:inline-block';
    return '<div class="slider-row">'
      +'<div class="slider-label">'
      +'<span class="slider-name" style="display:flex;align-items:center;gap:6px"><span style="'+dotStyle+'"></span>'+s.name+'</span>'
      +'<span class="slider-val" id="simVol_'+s.id+'">'+mult+'% &rarr; '+fmt(s.brut*mult/100)+'</span>'
      +'</div>'
      +'<input type="range" min="50" max="200" value="'+mult+'" '
      +'oninput="simMultipliers[\''+s.id+'\']=+this.value;document.getElementById(\'simVol_'+s.id+'\').textContent=this.value+\'% \u2192 \'+fmt('+s.brut+'*this.value/100);updateSimResults()">'
      +'</div>';
  }).join('');

  let simDetailRows = calcedSim.map(function(s, i){
    const orig = calc.suppliers[i] ? calc.suppliers[i].brut : 0;
    const d = s.brut - orig;
    return '<tr>'
      +'<td><span class="supplier-name"><span class="supplier-dot" style="background:'+(s.color||SUPPLIER_COLORS[i%SUPPLIER_COLORS.length])+'"></span>'+s.name+'</span></td>'
      +'<td class="num">'+fmt(orig)+'</td>'
      +'<td class="num">'+fmt(s.brut)+'</td>'
      +'<td class="num"><span class="'+(d>=0?'delta-pos':'delta-neg')+'">'+(d>=0?'+':'')+fmt(d)+'</span></td>'
      +'<td class="num">'+fmtEur(s.ca)+'</td>'
      +'</tr>';
  }).join('');

  document.getElementById('tab-simulation').innerHTML =
    '<div class="page-header"><h2>Simulation de sc\u00e9narios</h2><button class="btn btn-outline" onclick="resetSim()">\u21ba R\u00e9initialiser</button></div>'
    +'<div class="sim-layout">'
    +'<div class="sim-controls">'
    +'<h3>Agents</h3>'
    +'<div class="slider-row"><div class="slider-label"><span class="slider-name">ADM Value</span><span class="slider-val" id="simAdmVal">'+simAdmAgents+' agents</span></div>'
    +'<input type="range" min="10" max="300" value="'+simAdmAgents+'" oninput="simAdmAgents=+this.value;document.getElementById(\'simAdmVal\').textContent=this.value+\' agents\';updateSimResults()"></div>'
    +'<div class="slider-row"><div class="slider-label"><span class="slider-name">Active Contact</span><span class="slider-val" id="simActVal">'+simActAgents+' agents</span></div>'
    +'<input type="range" min="10" max="300" value="'+simActAgents+'" oninput="simActAgents=+this.value;document.getElementById(\'simActVal\').textContent=this.value+\' agents\';updateSimResults()"></div>'
    +'<h3>Volumes fournisseurs</h3>'
    +volSliders
    +'</div>'

    +'<div class="sim-results">'
    +'<div class="sim-kpi-grid">'
    +'<div class="sim-kpi"><div class="label">Brut simul\u00e9</div><div class="value">'+fmt(simT.brut)+'</div><div class="delta">'+delta(simT.brut,T.brut)+'</div></div>'
    +'<div class="sim-kpi"><div class="label">Sign\u00e9 simul\u00e9</div><div class="value">'+fmt(simT.signe)+'</div><div class="delta">'+delta(simT.signe,T.signe)+'</div></div>'
    +'<div class="sim-kpi"><div class="label">CA simul\u00e9</div><div class="value" style="font-size:18px">'+fmtEur(simT.ca)+'</div><div class="delta">'+deltaEur(simT.ca,T.ca)+'</div></div>'
    +'<div class="sim-kpi"><div class="label">Agents total</div><div class="value">'+(simAdmAgents+simActAgents)+'</div><div class="delta">'+delta(simAdmAgents+simActAgents,cc.adm.agents+cc.active.agents)+'</div></div>'
    +'</div>'

    +'<div class="section-card" style="margin-bottom:0">'
    +'<h3>Capacit\u00e9 vs Objectif</h3>'
    +'<div style="margin-top:12px;display:flex;flex-direction:column;gap:12px">'
    +'<div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--muted2)">ADM Value</span><span style="font-size:12px">'+feasBadge(simT.admBrut,simCapAdm)+' '+fmt(simT.admBrut)+' / '+fmt(simCapAdm)+'</span></div>'+feasBar(simT.admBrut,simCapAdm)+'</div>'
    +'<div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--muted2)">Active Contact</span><span style="font-size:12px">'+feasBadge(simT.actBrut,simCapAct)+' '+fmt(simT.actBrut)+' / '+fmt(simCapAct)+'</span></div>'+feasBar(simT.actBrut,simCapAct)+'</div>'
    +'</div></div>'

    +'<div class="section-card" style="margin-bottom:0"><h3>Comparaison Original vs Simul\u00e9</h3><div class="chart-container" style="height:220px"><canvas id="chartSimComparison"></canvas></div></div>'

    +'<div class="section-card" style="margin-bottom:0"><h3>D\u00e9tail par fournisseur</h3>'
    +'<table class="data-table"><thead><tr><th>Fournisseur</th><th class="num">Original</th><th class="num">Simul\u00e9</th><th class="num">&Delta; Brut</th><th class="num">CA simul\u00e9</th></tr></thead>'
    +'<tbody>'+simDetailRows+'</tbody>'
    +'<tfoot><tr class="row-total"><td><strong>TOTAL</strong></td><td class="num">'+fmt(T.brut)+'</td><td class="num">'+fmt(simT.brut)+'</td>'
    +'<td class="num"><span class="'+(simT.brut>=T.brut?'delta-pos':'delta-neg')+'">'+(simT.brut>=T.brut?'+':'')+fmt(simT.brut-T.brut)+'</span></td>'
    +'<td class="num">'+fmtEur(simT.ca)+'</td></tr></tfoot>'
    +'</table></div>'
    +'</div>'
    +'</div>';

  setTimeout(function(){
    initSimChart(calc.suppliers, calcedSim);
  }, 50);
}

function updateSimResults(){ renderSimulation(); }
function resetSim(){ initSim(); renderSimulation(); }

function updateCC(){
  const cc = getCCData();
  const admA = document.getElementById('admAgents');
  const admH = document.getElementById('admHours');
  const actA = document.getElementById('actAgents');
  const actH = document.getElementById('actHours');
  if(admA) cc.adm.agents = +admA.value || 95;
  if(admH) cc.adm.hoursPerDay = +admH.value || 7;
  if(actA) cc.active.agents = +actA.value || 75;
  if(actH) cc.active.hoursPerDay = +actH.value || 7;
  saveCCData(cc);
  renderConfig();
}

function updateSettings(){
  const data = getCurrentData();
  const wd = document.getElementById('workingDays');
  const pd = document.getElementById('productivity');
  if(wd) data.settings.workingDays = +wd.value || 26;
  if(pd) data.settings.productivityPerAgent = +pd.value || 20;
  saveCurrentData(data);
  renderConfig();
}

function updateSupplier(id, field, value){
  const data = getCurrentData();
  const s = data.suppliers.find(function(s){ return s.id === id; });
  if(s) s[field] = value;
  saveCurrentData(data);
  renderConfig();
}

function addSupplier(){
  const data = getCurrentData();
  data.suppliers.push({
    id: 's'+Date.now(),
    name: 'Nouveau fournisseur',
    brut: 1000, txSig: 0.65, txFact: 0.85,
    valMoy: 120, priority: 2, splitMode: 'auto', splitAdm: 56
  });
  saveCurrentData(data);
  renderConfig();
}

function removeSupplier(id){
  const data = getCurrentData();
  if(data.suppliers.length <= 1){ alert('Impossible de supprimer le dernier fournisseur.'); return; }
  if(!confirm('Supprimer ce fournisseur ?')) return;
  data.suppliers = data.suppliers.filter(function(s){ return s.id !== id; });
  saveCurrentData(data);
  renderConfig();
}

function setMatrixView(v){ matrixView = v; renderMatrix(); }
function setMatrixPeriod(p){ matrixPeriod = p; renderMatrix(); }

function duplicateMonth(){
  const src = document.getElementById('dupSource') ? document.getElementById('dupSource').value : null;
  const tgt = document.getElementById('dupTarget') ? document.getElementById('dupTarget').value : null;
  if(!src || !tgt || src === tgt){ alert('S\u00e9lectionnez des mois diff\u00e9rents.'); return; }
  const parts = tgt.split('-');
  const tgtName = MONTHS_FR[+parts[1]-1]+' '+parts[0];
  if(!confirm('Dupliquer vers '+tgtName+' ? Les donn\u00e9es existantes seront \u00e9cras\u00e9es.')) return;
  const srcData = getMonthData(src);
  saveMonthData(tgt, JSON.parse(JSON.stringify(srcData)));
  alert('Donn\u00e9es copi\u00e9es vers '+tgtName+' \u2713');
}

function copyPrevMonth(){
  const prevM = currentMonth === 0 ? 11 : currentMonth - 1;
  const prevY = currentMonth === 0 ? currentYear - 1 : currentYear;
  const prevKey = getMonthKey(prevY, prevM);
  const prevName = MONTHS_FR[prevM]+' '+prevY;
  const curName = MONTHS_FR[currentMonth]+' '+currentYear;
  if(!confirm('Reprendre les objectifs de '+prevName+' vers '+curName+' ?')) return;
  const prevData = getMonthData(prevKey);
  saveCurrentData(JSON.parse(JSON.stringify(prevData)));
  renderTab(activeTab);
  alert('Objectifs de '+prevName+' copi\u00e9s \u2713');
}

function exportPDF(){
  window.print();
}

document.addEventListener('DOMContentLoaded', function(){
  chartDefaults();
  updateHeader();
  initSim();
  showTab('dashboard');

  document.querySelectorAll('.nav-tab').forEach(function(btn){
    btn.addEventListener('click', function(){ showTab(btn.dataset.tab); });
  });
  document.getElementById('btnPrevMonth').addEventListener('click', prevMonth);
  document.getElementById('btnNextMonth').addEventListener('click', nextMonth);
  document.getElementById('btnExport').addEventListener('click', exportPDF);
});
</script>
